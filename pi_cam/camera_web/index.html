<!doctype html><html><head><meta charset="utf-8"><title>摄像头</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#cam{max-width:100%;max-height:100%;transition:transform .25s}
#cam.r90,#cam.r270{max-width:100vh;max-height:100vw}
#bar{position:fixed;right:10px;bottom:10px;display:flex;gap:10px;opacity:.85}
#bar button{width:64px;height:64px;border:none;border-radius:14px;background:rgba(40,44,60,.75);
  color:#fff;font-size:28px;font-weight:700;touch-action:manipulation;cursor:pointer}
#bar button:active{background:rgba(90,100,140,.9)}
</style></head><body>
<div id="stage"><img id="cam" src="/stream" alt="camera"></div>
<div id="bar">
  <button id="zout" title="缩小">－</button>
  <button id="zin" title="放大">＋</button>
  <button id="rot" title="旋转">⟳</button>
</div>
<script>
var cam=document.getElementById('cam');
var st=JSON.parse(localStorage.getItem('camview')||'{"r":0,"z":1}');
function apply(){
  cam.className=(st.r%180)?'r'+st.r:'';
  cam.style.transform='rotate('+st.r+'deg) scale('+st.z+')';
  localStorage.setItem('camview',JSON.stringify(st));
}
document.getElementById('rot').onclick=function(){st.r=(st.r+90)%360;apply();};
document.getElementById('zin').onclick=function(){st.z=Math.min(st.z*1.5,6);apply();};
document.getElementById('zout').onclick=function(){st.z=Math.max(st.z/1.5,1);apply();};
apply();
</script></body></html>
