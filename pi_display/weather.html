<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新吴区天气</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  color:#f2f6ff;cursor:none;user-select:none;
  background:linear-gradient(180deg,#0a1730 0%,#12264a 55%,#1a3560 100%);
  transition:background 1s;
}
body.day{background:linear-gradient(180deg,#2e6ab8 0%,#4f8fd4 55%,#7db4e6 100%)}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
.cloud{position:fixed;border-radius:50%;background:rgba(255,255,255,.07);filter:blur(28px);pointer-events:none;z-index:0}
/* ---------- pager ---------- */
#pager{display:flex;width:200vw;height:100vh;position:relative;z-index:1;
  transition:transform .45s ease}
.page{width:100vw;height:100vh;padding:10px;flex:none;overflow:hidden}
#dots{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:9px}
#dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28);
  transition:background .3s}
#dots span.on{background:#fff}
/* ---------- cards ---------- */
.card{background:rgba(13,24,48,.55);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:12px 15px}
body.day .card{background:rgba(8,30,66,.32)}
.ctitle{font-size:12.5px;color:rgba(235,240,255,.55);font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.ctitle svg{flex:none}
/* ---------- page 1 ---------- */
#app{display:grid;grid-template-columns:352px 1fr;gap:12px;height:100%}
#left{display:flex;flex-direction:column;min-height:0}
#topbar{display:flex;align-items:baseline;gap:10px}
#clock{font-size:36px;font-weight:600;line-height:1;letter-spacing:0}
#date{font-size:14px;color:rgba(235,240,255,.65)}
#hero{text-align:center;margin-top:4px}
#loc{display:flex;align-items:center;justify-content:center;gap:6px;font-size:24px;font-weight:600}
#loc svg{flex:none}
#curtemp{font-size:88px;font-weight:200;line-height:1.05;margin-left:-5px}
#cond{font-size:19px;font-weight:500}
#hl{font-size:15.5px;color:rgba(235,240,255,.85);margin-top:3px}
#summary{font-size:14px;color:rgba(235,240,255,.8);line-height:1.55;margin-top:8px}
#alerts{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.alert{display:flex;gap:10px;align-items:center}
.alert .t{font-size:16px;font-weight:700}
.alert .d{font-size:13.5px;color:rgba(235,240,255,.75);margin-top:2px;line-height:1.45}
#aqi .row{display:flex;align-items:baseline;gap:8px}
#aqiVal{font-size:34px;font-weight:600}
#aqiLvl{font-size:15px;font-weight:700}
#aqiBar{position:relative;height:6px;border-radius:3px;margin:8px 0 6px;
  background:linear-gradient(90deg,#4cd964 0%,#a3e048 17%,#ffcc00 33%,#ff9f43 50%,#ff5e3a 67%,#b04ad8 84%,#8b1e3f 100%)}
#aqiDot{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;
  border:2px solid rgba(0,0,0,.35);transform:translate(-50%,-50%)}
#aqiTxt{font-size:11px;color:rgba(235,240,255,.55)}
#status{margin-top:auto;font-size:12.5px;color:rgba(235,240,255,.45);display:flex;align-items:center;gap:6px}
#dot{width:8px;height:8px;border-radius:50%;background:#4cd964;flex:none}
#trend{flex:1;min-height:0;margin-top:8px;display:flex;flex-direction:column;padding-bottom:9px}
#sunInfo,#sunInfoT{margin-left:auto;font-weight:400;font-size:11px;color:rgba(255,214,10,.9)}
#right{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
#todayCurve{height:185px;display:flex;flex-direction:column}
#todayBox,#trendBox{flex:1;min-height:0;margin:1px -5px -5px}
#daily{flex:1;display:flex;flex-direction:column;min-height:0}
#dlist{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.drow{display:flex;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.07)}
.drow:first-child{border-top:none}
.dday{width:44px;font-size:15.5px;font-weight:600;flex:none}
.dicon{width:60px;flex:none;display:flex;flex-direction:column;align-items:center}
.dp{font-size:10px;color:#6ec6ff;height:11px;font-weight:600}
.dlo{width:38px;text-align:right;font-size:15.5px;color:rgba(235,240,255,.55);flex:none}
.dhi{width:40px;font-size:15.5px;font-weight:600;flex:none}
.dbar{position:relative;flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin:0 8px}
.dseg{position:absolute;top:0;height:100%;border-radius:3px}
.dnow{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#fff;
  border:1.5px solid rgba(0,0,0,.3);transform:translate(-50%,-50%)}
#foot{margin-left:auto;font-weight:400;font-size:10.5px;color:rgba(235,240,255,.35)}
/* ---------- page 2: 4x3 ---------- */
#grid2{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;height:100%}
.dcard{display:flex;flex-direction:column;min-height:0;min-width:0}
.dcard .big{font-size:42px;font-weight:600;line-height:1.12;letter-spacing:-.5px}
.dcard .big small{font-size:17px;font-weight:600;color:rgba(235,240,255,.85)}
.dcard .sub{font-size:13.5px;font-weight:700;margin-top:1px}
.dcard .desc{font-size:12px;color:rgba(235,240,255,.6);margin-top:auto;line-height:1.45}
.wide{grid-column:span 2}
.wflex{flex:1;display:flex;align-items:center;gap:10px;min-height:0}
.wrows{flex:1;display:flex;flex-direction:column;font-size:15px}
.wrows .wr{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(255,255,255,.09);padding:6px 0}
.wrows .wr:first-child{border-top:none}
.wrows .wr span{color:rgba(235,240,255,.75);font-weight:600}
.wrows .wr b{font-weight:700;font-size:15px}
.gbar{position:relative;height:6px;border-radius:3px;margin:9px 0 7px}
.gdot{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;
  border:2px solid rgba(0,0,0,.35);transform:translate(-50%,-50%)}
.avgfoot{display:flex;justify-content:space-between;margin-top:auto}
.avgfoot span{display:block;font-size:11px;color:rgba(235,240,255,.55)}
.avgfoot b{font-size:13.5px;font-weight:700}
#moonName{font-size:17px;font-weight:700}
#moonCard .mrows{flex:1;display:flex;flex-direction:column;font-size:14px}
#moonCard .mrows .wr{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.09);padding:5.5px 0}
#moonCard .mrows .wr:first-child{border-top:none}
#moonCard .mrows .wr span{color:rgba(235,240,255,.75);font-weight:600}
#moonCard .mrows .wr b{font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div id="stars"></div>
<div class="cloud" style="width:420px;height:150px;top:-40px;left:12%"></div>
<div class="cloud" style="width:520px;height:170px;top:22%;right:-160px"></div>
<div class="cloud" style="width:380px;height:130px;bottom:-50px;left:38%"></div>

<div id="pager">
  <!-- ============ P1 概览 ============ -->
  <section class="page">
    <div id="app">
      <div id="left">
        <div id="topbar">
          <div id="clock">--:--</div>
          <div id="date">----年--月--日</div>
        </div>
        <div id="hero">
          <div id="loc"></div>
          <div id="curtemp">--°</div>
          <div id="cond">获取中…</div>
          <div id="hl"></div>
        </div>
        <div id="summary"></div>
        <div id="aqi" class="card" style="display:none;margin-top:10px">
          <div class="row"><span id="aqiVal">--</span><span id="aqiLvl">--</span></div>
          <div id="aqiBar"><div id="aqiDot"></div></div>
          <div id="aqiTxt"></div>
        </div>
        <div id="alerts"></div>
        <div class="card" id="trend">
          <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M3 17 8 11l4 3 6-8" stroke="rgba(235,240,255,.55)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M14 6h4v4" stroke="rgba(235,240,255,.55)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>全天气温 · 明天<span id="sunInfo"></span></div>
          <div id="trendBox"></div>
        </div>
        <div id="status"><span id="dot"></span><span id="statusTxt">等待数据…</span></div>
      </div>
      <div id="right">
        <div class="card" id="todayCurve">
          <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M3 17 8 11l4 3 6-8" stroke="rgba(235,240,255,.55)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M14 6h4v4" stroke="rgba(235,240,255,.55)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>全天气温 · 今天<span id="sunInfoT"></span></div>
          <div id="todayBox"></div>
        </div>
        <div class="card" id="daily">
          <div class="ctitle">10 日天气预报<span id="foot">数据来源 Open-Meteo · AQI 由 PM 浓度按国标估算</span></div>
          <div id="dlist"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ P2 详情 4x3 ============ -->
  <section class="page">
    <div id="grid2">
      <div class="card dcard">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M3 17 8 11l4 3 6-8" stroke="rgba(235,240,255,.55)" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M14 6h4v4" stroke="rgba(235,240,255,.55)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>平均</div>
        <div class="big" id="avgVal">--</div>
        <div class="sub" id="avgDir">--</div>
        <div class="avgfoot">
          <div><span>今天</span><b id="avgToday">--</b></div>
          <div style="text-align:right"><span>10日均值</span><b id="avgMean">--</b></div>
        </div>
      </div>
      <div class="card dcard">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M10 4a2 2 0 0 1 4 0v7.3a4.5 4.5 0 1 1-4 0z" fill="none" stroke="rgba(235,240,255,.55)" stroke-width="1.8"/><circle cx="12" cy="16.5" r="2" fill="rgba(235,240,255,.55)"/></svg>体感温度</div>
        <div class="big" id="feelVal">--°</div>
        <div class="desc" id="feelDesc">--</div>
      </div>
      <div class="card dcard wide">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M3 8h9a2.5 2.5 0 1 0-2.4-3.2M3 12h13a2.5 2.5 0 1 1-2.4 3.2M3 16h7" stroke="rgba(235,240,255,.55)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>风</div>
        <div class="wflex">
          <div class="wrows">
            <div class="wr"><span>风</span><b id="windVal">--</b></div>
            <div class="wr"><span>阵风</span><b id="gustVal">--</b></div>
            <div class="wr"><span>方向</span><b id="wdirVal">--</b></div>
          </div>
          <div id="compass" style="flex:none"></div>
        </div>
      </div>
      <div class="card dcard">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="rgba(235,240,255,.55)" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" stroke="rgba(235,240,255,.55)" stroke-width="1.6" stroke-linecap="round"/></svg>紫外线指数</div>
        <div class="big" id="uvVal">--</div>
        <div class="sub" id="uvLvl">--</div>
        <div class="gbar" style="background:linear-gradient(90deg,#4cd964,#ffcc00,#ff9f43,#ff5e3a,#b04ad8)">
          <div class="gdot" id="uvDot" style="left:0%"></div>
        </div>
        <div class="desc" id="uvDesc" style="margin-top:0">--</div>
      </div>
      <div class="card dcard">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 10a4 4 0 0 1 4 4H8a4 4 0 0 1 4-4z" fill="rgba(235,240,255,.55)"/><path d="M12 3v3M4 17h16M5.6 13.6 7 15M18.4 13.6 17 15" stroke="rgba(235,240,255,.55)" stroke-width="1.6" stroke-linecap="round"/></svg>日出</div>
        <div class="big" id="srVal">--:--</div>
        <div id="sunarc" style="text-align:center;margin:auto 0"></div>
        <div class="desc" style="margin-top:0" id="ssVal">日落 --:--</div>
      </div>
      <div class="card dcard wide" id="moonCard">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M19.5 14.8A8.4 8.4 0 1 1 9.2 4.5a6.9 6.9 0 0 0 10.3 10.3z" fill="rgba(235,240,255,.55)"/></svg>月相</div>
        <div class="wflex">
          <div class="mrows">
            <div id="moonName">--</div>
            <div class="wr"><span>照亮比例</span><b id="moonIllum">--</b></div>
            <div class="wr"><span>月龄</span><b id="moonAge">--</b></div>
            <div class="wr"><span>距下次满月</span><b id="moonFull">--</b></div>
          </div>
          <div id="moonPic" style="flex:none"></div>
        </div>
      </div>
      <div class="card dcard">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 3s5.5 6 5.5 10a5.5 5.5 0 1 1-11 0C6.5 9 12 3 12 3z" fill="none" stroke="rgba(235,240,255,.55)" stroke-width="1.8"/></svg>湿度</div>
        <div class="big" id="humVal">--<small>%</small></div>
        <div class="desc" id="dewVal">目前露点温度为 --°</div>
      </div>
      <div class="card dcard">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M4 15a8 8 0 1 1 16 0" fill="none" stroke="rgba(235,240,255,.55)" stroke-width="1.8"/><path d="M12 15l4-5" stroke="rgba(235,240,255,.55)" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="15" r="1.6" fill="rgba(235,240,255,.55)"/></svg>气压</div>
        <div id="pgauge" style="text-align:center;margin:auto 0"></div>
        <div class="desc" style="margin-top:0;text-align:center;font-size:11px" id="presDesc">--</div>
      </div>
      <div class="card dcard">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 3s5.5 6 5.5 10a5.5 5.5 0 1 1-11 0C6.5 9 12 3 12 3z" fill="rgba(235,240,255,.55)"/></svg>降水</div>
        <div class="big" id="rainVal">--<small>毫米</small></div>
        <div class="sub">今天</div>
        <div class="desc" id="rainDesc">--</div>
      </div>
      <div class="card dcard">
        <div class="ctitle"><svg width="13" height="13" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" fill="none" stroke="rgba(235,240,255,.55)" stroke-width="1.8"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="rgba(235,240,255,.55)" stroke-width="1.6"/></svg>能见度</div>
        <div class="big" id="visVal">--<small>km</small></div>
        <div class="desc" id="visDesc">--</div>
      </div>
    </div>
  </section>
</div>
<div id="dots"><span class="on"></span><span></span></div>

<script>
'use strict';
/* ================= 配置 ================= */
const CFG = {
  lat: 31.49, lon: 120.36, name: '新吴区',
  refreshMs: 30*60*1000,      // 天气刷新周期
  retryMs:   2*60*1000,       // 失败重试
  reloadMs:  6*3600*1000,     // 整页重载防内存累积
};
const FC_URL = 'https://api.open-meteo.com/v1/forecast?latitude='+CFG.lat+'&longitude='+CFG.lon
  + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,pressure_msl'
  + '&hourly=temperature_2m,weather_code,precipitation_probability,is_day,uv_index,visibility,dewpoint_2m'
  + '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,precipitation_sum,uv_index_max'
  + '&timezone=Asia%2FShanghai&forecast_days=10';
const AQ_URL = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+CFG.lat+'&longitude='+CFG.lon
  + '&current=pm2_5,pm10';

/* ================= WMO 天气码 ================= */
const WMO = {
  0:['晴','clear'],1:['大部晴朗','clear'],2:['局部多云','partly'],3:['阴','cloudy'],
  45:['雾','fog'],48:['冻雾','fog'],
  51:['毛毛雨','drizzle'],53:['毛毛雨','drizzle'],55:['浓毛毛雨','drizzle'],
  56:['冻毛毛雨','drizzle'],57:['冻毛毛雨','drizzle'],
  61:['小雨','rain'],63:['中雨','rain'],65:['大雨','rain'],
  66:['冻雨','rain'],67:['冻雨','rain'],
  71:['小雪','snow'],73:['中雪','snow'],75:['大雪','snow'],77:['雪粒','snow'],
  80:['阵雨','rain'],81:['强阵雨','rain'],82:['暴雨','rain'],
  85:['阵雪','snow'],86:['强阵雪','snow'],
  95:['雷暴','thunder'],96:['雷暴伴冰雹','thunder'],99:['雷暴伴冰雹','thunder'],
};
function wmo(c){ return WMO[c] || ['未知','cloudy']; }

/* ================= SVG 图标 ================= */
const S='stroke-linecap="round"';
function sunSVG(cx,cy,r){let g='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#ffd60a"/>';
  for(let i=0;i<8;i++){const a=i*Math.PI/4,x1=cx+Math.cos(a)*(r+2.5),y1=cy+Math.sin(a)*(r+2.5),
    x2=cx+Math.cos(a)*(r+5),y2=cy+Math.sin(a)*(r+5);
    g+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#ffd60a" stroke-width="1.8" '+S+'/>';}
  return g;}
const MOON='<path d="M19.5 14.8A8.4 8.4 0 1 1 9.2 4.5a6.9 6.9 0 0 0 10.3 10.3z" fill="#e8eaf6"/>';
const CLOUD='<path d="M7 17.5a3.8 3.8 0 0 1-.4-7.6 5.4 5.4 0 0 1 10.5 1.3 3.4 3.4 0 0 1-.4 6.3z" fill="#eef1f7"/>';
const CLOUD_D='<path d="M7 17.5a3.8 3.8 0 0 1-.4-7.6 5.4 5.4 0 0 1 10.5 1.3 3.4 3.4 0 0 1-.4 6.3z" fill="#c9d2e4"/>';
function drops(n){let g='';for(let i=0;i<n;i++){const x=8.5+i*4;
  g+='<line x1="'+x+'" y1="19" x2="'+(x-1.4)+'" y2="22" stroke="#5eb2f7" stroke-width="1.7" '+S+'/>';}return g;}
const BOLT='<polygon points="12.8,16.8 9.6,20.6 11.8,20.6 10.8,23.4 14.4,19.4 12.1,19.4 13.6,16.8" fill="#ffd60a"/>';
function flakes(){let g='';[[9,20.5],[13.5,21.5],[17,20]].forEach(p=>{
  g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.2" fill="#eaf4ff"/>';});return g;}
function icon(kind,day,size){
  size=size||26;let g='';
  if(kind==='clear') g = day? sunSVG(12,12,5.2) : MOON;
  else if(kind==='partly') g = (day? sunSVG(9,8.5,3.4) : '<g transform="translate(-2.5,-3.5) scale(.62)">'+MOON+'</g>') + '<g transform="translate(2.5,3.5)">'+CLOUD+'</g>';
  else if(kind==='cloudy') g = '<g transform="translate(0,-1)">'+CLOUD_D+'</g>';
  else if(kind==='fog') g = '<g transform="translate(0,-2)">'+CLOUD_D+'</g>'
    +'<line x1="7" y1="18.5" x2="17" y2="18.5" stroke="#aeb8cc" stroke-width="1.6" '+S+'/><line x1="9" y1="21" x2="15" y2="21" stroke="#aeb8cc" stroke-width="1.6" '+S+'/>';
  else if(kind==='drizzle') g = '<g transform="translate(0,-1.5)">'+CLOUD+'</g>'+drops(2);
  else if(kind==='rain') g = '<g transform="translate(0,-1.5)">'+CLOUD+'</g>'+drops(3);
  else if(kind==='snow') g = '<g transform="translate(0,-1.5)">'+CLOUD+'</g>'+flakes();
  else if(kind==='thunder') g = '<g transform="translate(0,-1.5)">'+CLOUD+'</g>'+BOLT;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24">'+g+'</svg>';
}

/* ================= CN AQI (HJ 633-2012, PM 24h 断点) ================= */
const BP25=[0,35,75,115,150,250,350,500], BP10=[0,50,150,250,350,420,500,600], IA=[0,50,100,150,200,300,400,500];
function iaqi(c,bp){ if(c==null) return 0;
  for(let i=1;i<bp.length;i++){ if(c<=bp[i]){ return Math.round(IA[i-1]+(IA[i]-IA[i-1])*(c-bp[i-1])/(bp[i]-bp[i-1])); } }
  return 500; }
function cnAqi(pm25,pm10){ return Math.max(iaqi(pm25,BP25), iaqi(pm10,BP10)); }
function aqiLevel(v){
  if(v<=50)  return ['优','#4cd964'];
  if(v<=100) return ['良','#d4e157'];
  if(v<=150) return ['轻度污染','#ffcc00'];
  if(v<=200) return ['中度污染','#ff9f43'];
  if(v<=300) return ['重度污染','#ff5e3a'];
  return ['严重污染','#b04ad8'];
}

function uvLevel(v){

/* ================= 月相（天文算法） ================= */
const SYN=29.530588853;   // 朔望月天数
function moonInfo(now){
  const ref=Date.UTC(2000,0,6,18,14);   // 2000-01-06 18:14 UTC 新月
  const age=((now-ref)/86400000)%SYN;
  const a=(age+SYN)%SYN;
  const p=a/SYN;                          // 0=新月 0.5=满月
  const illum=Math.round((1-Math.cos(2*Math.PI*p))/2*100);
  const names=[[1.85,'新月'],[5.54,'娥眉月'],[9.23,'上弦月'],[12.92,'盈凸月'],
               [16.61,'满月'],[20.30,'亏凸月'],[23.99,'下弦月'],[27.68,'残月'],[SYN,'新月']];
  let nm='新月';
  for(const [lim,n] of names){ if(a<=lim){ nm=n; break; } }
  const toFull=a<=SYN/2 ? SYN/2-a : SYN-a+SYN/2;
  return {age:a,p,illum,name:nm,toFull,toNew:(SYN-a)%SYN};
}
function moonSVG(p,size){
  const r=46,cx=50,cy=50;
  const rx=Math.max(0.5,Math.abs(Math.cos(2*Math.PI*p))*r);

  const same=(p<0.25||p>0.75);
  const s2=same?1-s1:s1;
  const d='M 50 '+(cy-r)+' A '+r+' '+r+' 0 0 '+s1+' 50 '+(cy+r)
        +' A '+rx.toFixed(1)+' '+r+' 0 0 '+s2+' 50 '+(cy-r)+' Z';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100">'
    +'<defs><radialGradient id="mg" cx="42%" cy="40%" r="75%">'

    +'<path d="'+d+'" fill="url(#mg)"/></svg>';
}

function compassSVG(deg,speed,size){

      +'" x2="'+(60+Math.sin(a)*R)+'" y2="'+(60-Math.cos(a)*R)

  }

  const P=(d,r)=>{const t=d*Math.PI/180;return [(60+Math.sin(t)*r).toFixed(1),(60-Math.cos(t)*r).toFixed(1)];};
  const [sx,sy]=P(deg,26), [ex,ey]=P(deg,44);            // 箭杆 (起点避开中心数字)
  const [tx,ty]=P(deg,53);                                // 箭头尖端
  const [w1x,w1y]=P(deg-8,40), [w2x,w2y]=P(deg+8,40);     // 箭翼

    +'<text x="60" y="70" fill="rgba(235,240,255,.6)" font-size="8.5" text-anchor="middle">km/h</text>'
    +'</svg>';
}
function pressureSVG(hpa,size){
  const lo=960,hi=1050;
  const f=Math.max(0,Math.min(1,(hpa-lo)/(hi-lo)));
  const A0=-120, A1=120;
  const pol=(a,r)=>{const t=a*Math.PI/180;return [60+Math.sin(t)*r, 60-Math.cos(t)*r];};
  let ticks='';
  for(let i=0;i<=40;i++){
    const a=A0+(A1-A0)*i/40, [x1,y1]=pol(a,i%10===0?47:52), [x2,y2]=pol(a,58);
    ticks+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)
      +'" stroke="rgba(255,255,255,'+(i%10===0?'.5':'.2')+')" stroke-width="'+(i%10===0?1.6:1)+'"/>';
  }
  const na=A0+(A1-A0)*f;
  const [nx,ny]=pol(na,52);                                        // 针尖指到刻度弧
  const [b1x,b1y]=pol(na-5,16), [b2x,b2y]=pol(na+5,16);            // 针尾 (中心轴毂)
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 120 120">'+ticks
    +'<polygon points="'+nx.toFixed(1)+','+ny.toFixed(1)+' '+b1x.toFixed(1)+','+b1y.toFixed(1)+' '+b2x.toFixed(1)+','+b2y.toFixed(1)+'" fill="#eef1f7"/>'

}
function sunArcSVG(frac,day,size){

/* hourly 索引: current.time 为 15 分钟对齐 (如 23:15), hourly.time 为整点,
   精确匹配必失败, 需按小时前缀匹配; 找不到则取第一个晚于当前的整点 */
function hourIdx(times, ctime){
  const curH=ctime.slice(0,13);
  for(let i=0;i<times.length;i++) if(times[i].slice(0,13)===curH) return i;
  for(let i=0;i<times.length;i++) if(times[i]>ctime) return i;
  return 0;
}

/* ================= 全天温度曲线 (P1) ================= */
const tc=t=> t<=10?'#5eb2f7': t<=16?'#57c7e8': t<=22?'#4cd9a4': t<=28?'#d4e157': t<=33?'#ffb74d':'#ff7a5c';
function fracHour(s){ return parseInt(s.slice(11,13),10)+parseInt(s.slice(14,16),10)/60; }
function smoothPath(p){
  let d='M '+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);
  for(let i=0;i<p.length-1;i++){
    const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];
    d+='C '+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)
      +' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)
      +' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
function dayTrendSVG(W,H,di,big){
  const h=lastFC.hourly, d0=lastFC.daily;
  const T=h.temperature_2m.slice(di*24, di*24+25);   // 当天 0 时 ~ 24 时(次日 0 时)
  if(T.length<25||W<60||H<40) return '';
  const lo=Math.min.apply(null,T), hi=Math.max.apply(null,T);
  const span=Math.max(1.5,hi-lo);
  const padL=big?12:8, padR=big?12:8, padT=big?16:12, padB=big?22:16;
  const fsA=big?12:10, fsE=big?13:10.5;             // 刻度/极值字号
  const pw=W-padL-padR, ph=H-padT-padB;
  const yLo=lo-span*0.28, yHi=hi+span*0.28;
  const X=i=>padL+pw*i/24;
  const Y=t=>padT+ph*(1-(t-yLo)/(yHi-yLo));
  const pts=[]; for(let i=0;i<25;i++) pts.push([X(i),Y(T[i])]);
  const line=smoothPath(pts);
  const area=line+'L '+X(24).toFixed(1)+' '+(padT+ph)+'L '+padL+' '+(padT+ph)+' Z';

  /* 按温度着色的描边渐变 */
  let stops='';
  for(let i=0;i<=24;i+=3) stops+='<stop offset="'+(i/24*100).toFixed(1)+'%" stop-color="'+tc(T[i])+'"/>';

  /* 夜间遮罩 + 日出日落虚线 */
  const srX=X(fracHour(d0.sunrise[di])), ssX=X(fracHour(d0.sunset[di]));
  const night='rgba(8,16,38,.32)';
  const sun='<rect x="'+padL+'" y="'+padT+'" width="'+Math.max(0,srX-padL).toFixed(1)+'" height="'+ph+'" fill="'+night+'"/>'
    +'<rect x="'+ssX.toFixed(1)+'" y="'+padT+'" width="'+Math.max(0,padL+pw-ssX).toFixed(1)+'" height="'+ph+'" fill="'+night+'"/>'
    +'<line x1="'+srX.toFixed(1)+'" y1="'+(padT-4)+'" x2="'+srX.toFixed(1)+'" y2="'+(padT+ph)+'" stroke="#ffd60a" stroke-width="1.2" stroke-dasharray="3 3" opacity=".9"/>'
    +'<line x1="'+ssX.toFixed(1)+'" y1="'+(padT-4)+'" x2="'+ssX.toFixed(1)+'" y2="'+(padT+ph)+'" stroke="#ffd60a" stroke-width="1.2" stroke-dasharray="3 3" opacity=".9"/>';

  /* 横轴时刻 (大卡每 3 小时, 小卡每 6 小时) */
  const ticks=big?[0,3,6,9,12,15,18,21,24]:[0,6,12,18,24];
  let axis='';
  for(const th of ticks){
    const a= th===0?'start': th===24?'end':'middle';
    axis+='<text x="'+X(th).toFixed(1)+'" y="'+(H-(big?6:3))+'" fill="rgba(235,240,255,.45)" font-size="'+fsA+'" text-anchor="'+a+'">'+th+'时</text>';
  }

  /* 最高/最低温标注 (最低温标注避开横轴时刻标签) */
  let iHi=0,iLo=0;
  for(let i=0;i<25;i++){ if(T[i]>T[iHi]) iHi=i; if(T[i]<T[iLo]) iLo=i; }
  let loX=X(iLo);
  for(const th of ticks){
    if(Math.abs(loX-X(th))<(big?30:24)){ loX=Math.min(W-padR-14,Math.max(padL+14,loX+(big?34:27))); break; }
  }
  const ext='<text x="'+X(iHi).toFixed(1)+'" y="'+(Y(T[iHi])-5).toFixed(1)+'" fill="rgba(255,255,255,.85)" font-size="'+fsE+'" font-weight="700" text-anchor="middle">'+Math.round(T[iHi])+'°</text>'
    +'<text x="'+loX.toFixed(1)+'" y="'+(Y(T[iLo])+fsE+3).toFixed(1)+'" fill="rgba(255,255,255,.6)" font-size="'+fsE+'" font-weight="700" text-anchor="middle">'+Math.round(T[iLo])+'°</text>';

  /* 当前时刻圆点 (仅今天) */
  let now='';
  if(di===0){
    const n=new Date(), nf=n.getHours()+n.getMinutes()/60;
    const i0=Math.min(23,Math.floor(nf)), f=nf-i0;
    const ct=T[i0]+(T[i0+1]-T[i0])*f;
    now='<circle cx="'+X(nf).toFixed(1)+'" cy="'+Y(ct).toFixed(1)+'" r="'+(big?5:4)+'" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/>';
  }

  return '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'
    +'<defs>'
    +'<linearGradient id="tgS'+di+'" x1="0" y1="0" x2="1" y2="0">'+stops+'</linearGradient>'
    +'<linearGradient id="tgF'+di+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="rgba(140,200,255,.30)"/><stop offset="100%" stop-color="rgba(140,200,255,0)"/></linearGradient>'
    +'</defs>'
    +sun
    +'<path d="'+area+'" fill="url(#tgF'+di+')"/>'
    +'<path d="'+line+'" fill="none" stroke="url(#tgS'+di+')" stroke-width="'+(big?2.6:2.2)+'" stroke-linecap="round"/>'
    +ext+axis+now
    +'</svg>';
}

    let dot='';
    if(i===0&&c.temperature_2m>d0.temperature_2m_min[0]&&c.temperature_2m<d0.temperature_2m_max[0]){
      const dp=((c.temperature_2m-d0.temperature_2m_min[0])/Math.max(1,(d0.temperature_2m_max[0]-d0.temperature_2m_min[0]))*100).toFixed(1);
      dot='<div class="dnow" style="left:'+dp+'%"></div>';
    }
    dh+='<div class="drow"><div class="dday">'+name+'</div>'
      +'<div class="dicon">'+icon(k3,true,20)+'<div class="dp">'+(p3!=null&&p3>=30?p3+'%':'')+'</div></div>'
      +'<div class="dlo">'+lo+'°</div>'
      +'<div class="dbar"><div class="dseg" style="left:'+l+'%;width:'+w+'%;background:linear-gradient(90deg,'+tc(d0.temperature_2m_min[i])+','+tc(d0.temperature_2m_max[i])+')">'+dot+'</div></div>'
      +'<div class="dhi">'+hi+'°</div></div>';
  }
  $('dlist').innerHTML=dh;
}

/* ================= 渲染 P2 ================= */
function renderP2(){
  const c=lastFC.current, d0=lastFC.daily;
  const h=lastFC.hourly;
  const i0=hourIdx(h.time,c.time);

  /* 平均 */
  const tmax0=Math.round(d0.temperature_2m_max[0]);
  let sm=0; for(let i=0;i<d0.time.length;i++) sm+=d0.temperature_2m_max[i];
  const mean=Math.round(sm/d0.time.length);
  const diff=tmax0-mean;
  $('avgVal').textContent=(diff>=0?'+':'')+diff+'°';
  $('avgDir').textContent=(diff>=0?'高于':'低于')+'日均最高温';
  $('avgToday').textContent='最高 '+tmax0+'°';
  $('avgMean').textContent='最高 '+mean+'°';

  /* 体感 */
  const feel=Math.round(c.apparent_temperature), act=Math.round(c.temperature_2m);
  $('feelVal').textContent=feel+'°';
  const fd=feel-act;
  $('feelDesc').textContent = fd>=2 ? '体感温度更高。' : (fd<=-2 ? '体感温度更低。' : '与实际温度相近。');

  /* 风 */
  $('windVal').textContent=Math.round(c.wind_speed_10m)+' km/h';
  $('gustVal').textContent=Math.round(c.wind_gusts_10m||0)+' km/h';
  $('wdirVal').textContent=windCn(c.wind_direction_10m)+' '+Math.round(c.wind_direction_10m)+'°';
  $('compass').innerHTML=compassSVG(c.wind_direction_10m,Math.round(c.wind_speed_10m),136);

  /* 紫外线 */
  const uvNow=(h.uv_index&&h.uv_index[i0]!=null)?h.uv_index[i0]:0;
  const uvMax=d0.uv_index_max?d0.uv_index_max[0]:uvNow;
  const uv=Math.round(uvNow*10)/10;
  const [ulvl,ucol,udesc]=uvLevel(uv);
  $('uvVal').textContent=uv;
  $('uvLvl').textContent=ulvl; $('uvLvl').style.color=ucol;
  $('uvDot').style.left=Math.min(100,uv/11*100)+'%';
  $('uvDesc').textContent=c.is_day? udesc : ('今日峰值 '+Math.round(uvMax)+'，夜间较弱。');

  /* 日出日落弧线 */
  const sr=d0.sunrise[0], ss=d0.sunset[0];
  $('srVal').textContent=sr.slice(11);
  $('ssVal').textContent='日落 '+ss.slice(11);
  const now=new Date(), t0=new Date(sr), t1=new Date(ss);
  const frac=(now-t0)/Math.max(1,(t1-t0));
  $('sunarc').innerHTML=sunArcSVG(frac,c.is_day===1&&frac>=0&&frac<=1,160);

  /* 月相 */
  const mi=moonInfo(Date.now());
  $('moonName').textContent=mi.name;
  $('moonIllum').textContent=mi.illum+'%';
  $('moonAge').textContent=(Math.round(mi.age*10)/10)+' 天';
  $('moonFull').textContent= mi.toFull<0.5?'就是今天':Math.round(mi.toFull)+' 天';
  $('moonPic').innerHTML=moonSVG(mi.p,136);

  /* 湿度 */
  $('humVal').innerHTML=c.relative_humidity_2m+'<small>%</small>';
  const dew=(h.dewpoint_2m&&h.dewpoint_2m[i0]!=null)?Math.round(h.dewpoint_2m[i0]):null;
  $('dewVal').textContent='目前露点温度为 '+(dew==null?'--':dew+'°')+'。';

  /* 气压 */
  const hpa=c.pressure_msl;
  $('pgauge').innerHTML=pressureSVG(hpa,126);
  $('presDesc').textContent= hpa>=1022?'气压偏高，天气稳定。':(hpa<=1005?'气压偏低，易有天气变化。':'气压正常。');

  /* 降水 */
  const sum0=d0.precipitation_sum?d0.precipitation_sum[0]:0;
  $('rainVal').innerHTML=(Math.round(sum0*10)/10)+'<small>毫米</small>';
  let rd='未来 10 天无明显降水。';
  for(let i=1;i<d0.time.length;i++){
    const s=d0.precipitation_sum?d0.precipitation_sum[i]:0;
    if(s>=0.5){
      const dt=new Date(d0.time[i]+'T00:00:00');
      rd='预计'+WD[dt.getDay()]+'会有 '+(Math.round(s*10)/10)+' 毫米。';
      break;
    }
  }
  $('rainDesc').textContent=rd;

  /* 能见度 */
  const visM=(h.visibility&&h.visibility[i0]!=null)?h.visibility[i0]:null;
  const visKm=visM==null?null:Math.round(visM/100)/10;
  $('visVal').innerHTML=(visKm==null?'--':visKm)+'<small>km</small>';
  $('visDesc').textContent=visKm==null?'':visDesc(visKm);
}

function render(){
  if(!lastFC) return;
  renderP1(); renderP2();
}

/* ================= 状态提示 ================= */
function setStatus(ok){
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  if(ok){ $('dot').style.background='#4cd964'; $('statusTxt').textContent='更新于 '+p(n.getHours())+':'+p(n.getMinutes()); }
  else{
    $('dot').style.background= lastFC? '#ffcc00':'#ff5e3a';
    $('statusTxt').textContent= lastFC? '更新失败，显示缓存数据':'数据获取失败，重试中…';
  }
}

/* ================= 翻页 (仅手动, 不自动切换) ================= */
const NPAGES=2;
let page=0;
function go(p){
  page=((p%NPAGES)+NPAGES)%NPAGES;
  $('pager').style.transform='translateX('+(-page*100)+'vw)';
  const ds=$('dots').children;
  for(let i=0;i<ds.length;i++) ds[i].className=i===page?'on':'';
}
let _tx=null;
document.addEventListener('touchstart',e=>{ _tx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',e=>{
  if(_tx==null) return;
  const dx=e.changedTouches[0].clientX-_tx; _tx=null;
  if(Math.abs(dx)>50) go(page+(dx<0?1:-1));
},{passive:true});
document.addEventListener('mousedown',e=>{ _tx=e.clientX; });
document.addEventListener('mouseup',e=>{
  if(_tx==null) return;
  const dx=e.clientX-_tx; _tx=null;
  if(Math.abs(dx)>50) go(page+(dx<0?1:-1));
});
$('dots').addEventListener('click',e=>{
  const i=[...$('dots').children].indexOf(e.target);
  if(i>=0) go(i);
});
/* 支持 #p1/#p2 指定初始页 (调试用) */
const _hp=location.hash.match(/^#p([12])$/); if(_hp) go(parseInt(_hp[1])-1);

/* ================= 拉取 ================= */
async function pull(){
  let ok=true;
  try{ const r=await fetch(FC_URL,{cache:'no-store'}); if(!r.ok) throw 0; lastFC=await r.json(); }
  catch(e){ ok=false; }
  try{ const r2=await fetch(AQ_URL,{cache:'no-store'}); if(!r2.ok) throw 0; lastAQ=await r2.json(); }
  catch(e){}
  if(ok){ render(); }
  setStatus(ok);
  setTimeout(pull, ok?CFG.refreshMs:CFG.retryMs);
}
buildStars(); pull();
setTimeout(()=>location.reload(), CFG.reloadMs);

/* ================= 防熄屏 ================= */
let _wl=null;
async function keepAwake(){ try{ _wl=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });
keepAwake();
</script>
