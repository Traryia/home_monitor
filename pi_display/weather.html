<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新吴区天气</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  color:#f2f6ff;cursor:none;user-select:none;
  background:linear-gradient(180deg,#0a1730 0%,#12264a 55%,#1a3560 100%);
  transition:background 1s;
}
body.day{background:linear-gradient(180deg,#2e6ab8 0%,#4f8fd4 55%,#7db4e6 100%)}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
.cloud{position:fixed;border-radius:50%;background:rgba(255,255,255,.07);filter:blur(28px);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;display:grid;grid-template-columns:336px 1fr;gap:12px;height:100vh;padding:14px}
/* ---------- left column ---------- */
#left{display:flex;flex-direction:column;gap:6px;min-height:0}
#topbar{display:flex;align-items:baseline;gap:10px}
#clock{font-size:30px;font-weight:600;line-height:1;letter-spacing:0}
#date{font-size:13px;color:rgba(235,240,255,.65)}
#hero{text-align:center;margin:4px 0 2px}
#loc{display:flex;align-items:center;justify-content:center;gap:6px;font-size:23px;font-weight:600}
#loc svg{flex:none}
#curtemp{font-size:88px;font-weight:200;line-height:1.05;margin-left:-4px}
#cond{font-size:17px;font-weight:500}
#hl{font-size:14px;color:rgba(235,240,255,.85);margin-top:3px}
#summary{font-size:13px;color:rgba(235,240,255,.78);line-height:1.5;margin-top:4px}
#meta{font-size:12.5px;color:rgba(235,240,255,.62);margin-top:4px;line-height:1.6;text-align:center}
.card{background:rgba(13,24,48,.55);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px 13px}
body.day .card{background:rgba(8,30,66,.32)}
.alert{display:flex;gap:10px;align-items:flex-start}
.alert .t{font-size:15px;font-weight:700}
.alert .d{font-size:12.5px;color:rgba(235,240,255,.72);margin-top:2px;line-height:1.45}
#aqi .row{display:flex;align-items:baseline;gap:8px}
#aqiVal{font-size:26px;font-weight:700}
#aqiLvl{font-size:15px;font-weight:600}
#aqiBar{position:relative;height:5px;border-radius:3px;margin:10px 0 8px;
  background:linear-gradient(90deg,#4cd964 0%,#a3e048 17%,#ffcc00 33%,#ff9f43 50%,#ff5e3a 67%,#b04ad8 84%,#8b1e3f 100%)}
#aqiDot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#fff;
  border:2px solid rgba(0,0,0,.35);transform:translate(-50%,-50%)}
#aqiTxt{font-size:12px;color:rgba(235,240,255,.62)}
#status{margin-top:auto;font-size:11.5px;color:rgba(235,240,255,.45);display:flex;align-items:center;gap:6px}
#dot{width:7px;height:7px;border-radius:50%;background:#4cd964;flex:none}
/* ---------- right column ---------- */
#right{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.ctitle{font-size:12px;color:rgba(235,240,255,.55);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:5px}
#hourly{display:flex;justify-content:space-between}
.hitem{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.hitem .ht{font-size:12.5px;color:rgba(235,240,255,.75);font-weight:600}
.hitem .hp{font-size:10.5px;color:#6ec6ff;height:12px;font-weight:600}
.hitem .hv{font-size:15.5px;font-weight:600}
#daily{flex:1;display:flex;flex-direction:column;min-height:0}
#dlist{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.drow{display:flex;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.07);padding:1px 0}
.drow:first-child{border-top:none}
.dday{width:40px;font-size:14.5px;font-weight:600;flex:none}
.dicon{width:56px;flex:none;display:flex;flex-direction:column;align-items:center}
.dp{font-size:10px;color:#6ec6ff;height:11px;font-weight:600}
.dlo{width:34px;text-align:right;font-size:15px;color:rgba(235,240,255,.55);flex:none}
.dhi{width:36px;font-size:15px;font-weight:600;flex:none}
.dbar{position:relative;flex:1;height:4.5px;border-radius:3px;background:rgba(255,255,255,.14);margin:0 6px}
.dseg{position:absolute;top:0;height:100%;border-radius:3px}
.dnow{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:#fff;
  border:1.5px solid rgba(0,0,0,.3);transform:translate(-50%,-50%)}
#foot{margin-left:auto;font-weight:400;font-size:10px;color:rgba(235,240,255,.35)}
</style>
</head>
<body>
<div id="stars"></div>
<div class="cloud" style="width:420px;height:150px;top:-40px;left:12%"></div>
<div class="cloud" style="width:520px;height:170px;top:22%;right:-160px"></div>
<div class="cloud" style="width:380px;height:130px;bottom:-50px;left:38%"></div>
<div id="app">
  <div id="left">
    <div id="topbar">
      <div id="clock">--:--</div>
      <div id="date">----年--月--日</div>
    </div>
    <div id="hero">
      <div id="loc"></div>
      <div id="curtemp">--°</div>
      <div id="cond">获取中…</div>
      <div id="hl"></div>
    </div>
    <div id="summary"></div>
    <div id="meta"></div>
    <div id="alerts"></div>
    <div id="aqi" class="card" style="display:none">
      <div class="row"><span id="aqiVal">--</span><span id="aqiLvl">--</span></div>
      <div id="aqiBar"><div id="aqiDot"></div></div>
      <div id="aqiTxt"></div>
    </div>
    <div id="status"><span id="dot"></span><span id="statusTxt">等待数据…</span></div>
  </div>
  <div id="right">
    <div class="card">
      <div class="ctitle">逐时预报</div>
      <div id="hourly"></div>
    </div>
    <div class="card" id="daily">
      <div class="ctitle">10 日天气预报<span id="foot">数据来源 Open-Meteo · AQI 由 PM 浓度按国标估算</span></div>
      <div id="dlist"></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= 配置 ================= */
const CFG = {
  lat: 31.49, lon: 120.36, name: '新吴区',
  refreshMs: 30*60*1000,      // 天气刷新周期
  retryMs:   2*60*1000,       // 失败重试
  reloadMs:  6*3600*1000,     // 整页重载防内存累积
};
const FC_URL = 'https://api.open-meteo.com/v1/forecast?latitude='+CFG.lat+'&longitude='+CFG.lon
  + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_gusts_10m'
  + '&hourly=temperature_2m,weather_code,precipitation_probability,is_day'
  + '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max'
  + '&timezone=Asia%2FShanghai&forecast_days=10';
const AQ_URL = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+CFG.lat+'&longitude='+CFG.lon
  + '&current=pm2_5,pm10';

/* ================= WMO 天气码 ================= */
const WMO = {
  0:['晴','clear'],1:['大部晴朗','clear'],2:['局部多云','partly'],3:['阴','cloudy'],
  45:['雾','fog'],48:['冻雾','fog'],
  51:['毛毛雨','drizzle'],53:['毛毛雨','drizzle'],55:['浓毛毛雨','drizzle'],
  56:['冻毛毛雨','drizzle'],57:['冻毛毛雨','drizzle'],
  61:['小雨','rain'],63:['中雨','rain'],65:['大雨','rain'],
  66:['冻雨','rain'],67:['冻雨','rain'],
  71:['小雪','snow'],73:['中雪','snow'],75:['大雪','snow'],77:['雪粒','snow'],
  80:['阵雨','rain'],81:['强阵雨','rain'],82:['暴雨','rain'],
  85:['阵雪','snow'],86:['强阵雪','snow'],
  95:['雷暴','thunder'],96:['雷暴伴冰雹','thunder'],99:['雷暴伴冰雹','thunder'],
};
function wmo(c){ return WMO[c] || ['未知','cloudy']; }

/* ================= SVG 图标 ================= */
const S='stroke-linecap="round"';
function sunSVG(cx,cy,r){let g='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#ffd60a"/>';
  for(let i=0;i<8;i++){const a=i*Math.PI/4,x1=cx+Math.cos(a)*(r+2.5),y1=cy+Math.sin(a)*(r+2.5),
    x2=cx+Math.cos(a)*(r+5),y2=cy+Math.sin(a)*(r+5);
    g+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#ffd60a" stroke-width="1.8" '+S+'/>';}
  return g;}
const MOON='<path d="M19.5 14.8A8.4 8.4 0 1 1 9.2 4.5a6.9 6.9 0 0 0 10.3 10.3z" fill="#e8eaf6"/>';
const CLOUD='<path d="M7 17.5a3.8 3.8 0 0 1-.4-7.6 5.4 5.4 0 0 1 10.5 1.3 3.4 3.4 0 0 1-.4 6.3z" fill="#eef1f7"/>';
const CLOUD_D='<path d="M7 17.5a3.8 3.8 0 0 1-.4-7.6 5.4 5.4 0 0 1 10.5 1.3 3.4 3.4 0 0 1-.4 6.3z" fill="#c9d2e4"/>';
function drops(n){let g='';for(let i=0;i<n;i++){const x=8.5+i*4;
  g+='<line x1="'+x+'" y1="19" x2="'+(x-1.4)+'" y2="22" stroke="#5eb2f7" stroke-width="1.7" '+S+'/>';}return g;}
const BOLT='<polygon points="12.8,16.8 9.6,20.6 11.8,20.6 10.8,23.4 14.4,19.4 12.1,19.4 13.6,16.8" fill="#ffd60a"/>';
function flakes(){let g='';[[9,20.5],[13.5,21.5],[17,20]].forEach(p=>{
  g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="1.2" fill="#eaf4ff"/>';});return g;}
function icon(kind,day,size){
  size=size||26;let g='';
  if(kind==='clear') g = day? sunSVG(12,12,5.2) : MOON;
  else if(kind==='partly') g = (day? sunSVG(9,8.5,3.4) : '<g transform="translate(-2.5,-3.5) scale(.62)">'+MOON+'</g>') + '<g transform="translate(2.5,3.5)">'+CLOUD+'</g>';
  else if(kind==='cloudy') g = '<g transform="translate(0,-1)">'+CLOUD_D+'</g>';
  else if(kind==='fog') g = '<g transform="translate(0,-2)">'+CLOUD_D+'</g>'
    +'<line x1="7" y1="18.5" x2="17" y2="18.5" stroke="#aeb8cc" stroke-width="1.6" '+S+'/><line x1="9" y1="21" x2="15" y2="21" stroke="#aeb8cc" stroke-width="1.6" '+S+'/>';
  else if(kind==='drizzle') g = '<g transform="translate(0,-1.5)">'+CLOUD+'</g>'+drops(2);
  else if(kind==='rain') g = '<g transform="translate(0,-1.5)">'+CLOUD+'</g>'+drops(3);
  else if(kind==='snow') g = '<g transform="translate(0,-1.5)">'+CLOUD+'</g>'+flakes();
  else if(kind==='thunder') g = '<g transform="translate(0,-1.5)">'+CLOUD+'</g>'+BOLT;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24">'+g+'</svg>';
}
const PIN='<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="#f2f6ff"/></svg>';
const WARN='<svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3 1.8 20.2h20.4zm0 6.2v4.6" stroke="#ffd60a" stroke-width="2" fill="#ffd60a" '+S+'/><circle cx="12" cy="17.4" r="1.3" fill="#3a2b00"/><path d="M12 3 1.8 20.2h20.4z" fill="rgba(255,214,10,.18)" stroke="#ffd60a" stroke-width="1.6" stroke-linejoin="round"/></svg>';

/* ================= CN AQI (HJ 633-2012, PM 24h 断点) ================= */
const BP25=[0,35,75,115,150,250,350,500], BP10=[0,50,150,250,350,420,500,600], IA=[0,50,100,150,200,300,400,500];
function iaqi(c,bp){ if(c==null) return 0;
  for(let i=1;i<bp.length;i++){ if(c<=bp[i]){ return Math.round(IA[i-1]+(IA[i]-IA[i-1])*(c-bp[i-1])/(bp[i]-bp[i-1])); } }
  return 500; }
function cnAqi(pm25,pm10){ return Math.max(iaqi(pm25,BP25), iaqi(pm10,BP10)); }
function aqiLevel(v){
  if(v<=50)  return ['优','#4cd964'];
  if(v<=100) return ['良','#d4e157'];
  if(v<=150) return ['轻度污染','#ffcc00'];
  if(v<=200) return ['中度污染','#ff9f43'];
  if(v<=300) return ['重度污染','#ff5e3a'];
  return ['严重污染','#b04ad8'];
}

/* ================= 状态 ================= */
let lastFC=null, lastAQ=null, lastOK=0;
const $=id=>document.getElementById(id);

/* ================= 时钟 ================= */
const WD=['周日','周一','周二','周三','周四','周五','周六'];
function tickClock(){
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  $('clock').textContent=p(n.getHours())+':'+p(n.getMinutes());
  $('date').textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日 '+WD[n.getDay()];
}
setInterval(tickClock,1000); tickClock();

/* ================= 星空背景 ================= */
function buildStars(){
  const box=$('stars'); box.innerHTML='';
  for(let i=0;i<70;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=(Math.random()*1.6+0.6).toFixed(1);
    s.style.width=s.style.height=sz+'px';
    s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    box.appendChild(s);
  }
}

/* ================= 渲染 ================= */
function render(){
  if(!lastFC) return;
  const c=lastFC.current, day=c.is_day===1;
  document.body.classList.toggle('day', day);
  $('stars').style.display = day?'none':'block';
  const [txt,kind]=wmo(c.weather_code);
  $('loc').innerHTML=PIN+'<span>'+CFG.name+'</span>';
  $('curtemp').textContent=Math.round(c.temperature_2m)+'°';
  $('cond').textContent=txt;
  const d0=lastFC.daily;
  $('hl').textContent='最高 '+Math.round(d0.temperature_2m_max[0])+'°  最低 '+Math.round(d0.temperature_2m_min[0])+'°';
  const wind=Math.round(c.wind_speed_10m);
  const gust=Math.round(c.wind_gusts_10m||0);
  $('summary').textContent='今天将持续'+txt+'。阵风风速最高 '+gust+' km/h。';
  $('meta').innerHTML='体感 '+Math.round(c.apparent_temperature)+'° · 湿度 '+c.relative_humidity_2m+'% · 风 '+wind+' km/h<br>'
    +'日出 '+d0.sunrise[0].slice(11)+' · 日落 '+d0.sunset[0].slice(11);

  /* 提醒（由预报数据推导，非官方预警） */
  let ah='';
  const tmax=Math.round(d0.temperature_2m_max[0]);
  if(tmax>=35){
    const lv=tmax>=40?'红色':(tmax>=37?'橙色':'黄色');
    ah+='<div class="card alert">'+WARN+'<div><div class="t">高温'+lv+'提醒</div>'
      +'<div class="d">预计今日最高 '+tmax+'°，注意防暑降温</div></div></div>';
  }
  const pp=d0.precipitation_probability_max[0];
  if(pp!=null&&pp>=60){
    ah+='<div class="card alert">'+WARN+'<div><div class="t">降雨提醒</div>'
      +'<div class="d">今日降水概率 '+pp+'%，出门带伞</div></div></div>';
  }
  $('alerts').innerHTML=ah;

  /* 逐时 */
  const h=lastFC.hourly;
  let i0=h.time.indexOf(c.time); if(i0<0)i0=0;
  let hh='';
  for(let i=i0;i<Math.min(i0+12,h.time.length);i++){
    const hr=parseInt(h.time[i].slice(11,13),10);
    const [t2,k2]=wmo(h.weather_code[i]);
    const p2=h.precipitation_probability?h.precipitation_probability[i]:null;
    hh+='<div class="hitem"><div class="ht">'+(i===i0?'现在':hr+'时')+'</div>'
      +'<div class="hp">'+(p2!=null&&p2>=30?p2+'%':'')+'</div>'
      +icon(k2,h.is_day?h.is_day[i]===1:day,26)
      +'<div class="hv">'+Math.round(h.temperature_2m[i])+'°</div></div>';
  }
  $('hourly').innerHTML=hh;

  /* 7 日 */
  let wmin=99,wmax=-99;
  for(let i=0;i<d0.time.length;i++){ wmin=Math.min(wmin,d0.temperature_2m_min[i]); wmax=Math.max(wmax,d0.temperature_2m_max[i]); }
  const span=Math.max(1,wmax-wmin);
  const tc=t=> t<=10?'#5eb2f7': t<=16?'#57c7e8': t<=22?'#4cd9a4': t<=28?'#d4e157': t<=33?'#ffb74d':'#ff7a5c';
  let dh='';
  for(let i=0;i<d0.time.length;i++){
    const dt=new Date(d0.time[i]+'T00:00:00');
    const name=i===0?'今天':WD[dt.getDay()];
    const [t3,k3]=wmo(d0.weather_code[i]);
    const lo=Math.round(d0.temperature_2m_min[i]), hi=Math.round(d0.temperature_2m_max[i]);
    const p3=d0.precipitation_probability_max?d0.precipitation_probability_max[i]:null;
    const l=((d0.temperature_2m_min[i]-wmin)/span*100).toFixed(1);
    const w=((d0.temperature_2m_max[i]-d0.temperature_2m_min[i])/span*100).toFixed(1);
    let dot='';
    if(i===0&&c.temperature_2m>d0.temperature_2m_min[0]&&c.temperature_2m<d0.temperature_2m_max[0]){
      const dp=((c.temperature_2m-d0.temperature_2m_min[0])/Math.max(1,(d0.temperature_2m_max[0]-d0.temperature_2m_min[0]))*100).toFixed(1);
      dot='<div class="dnow" style="left:'+dp+'%"></div>';
    }
    dh+='<div class="drow"><div class="dday">'+name+'</div>'
      +'<div class="dicon">'+icon(k3,true,24)+'<div class="dp">'+(p3!=null&&p3>=30?p3+'%':'')+'</div></div>'
      +'<div class="dlo">'+lo+'°</div>'
      +'<div class="dbar"><div class="dseg" style="left:'+l+'%;width:'+w+'%;background:linear-gradient(90deg,'+tc(d0.temperature_2m_min[i])+','+tc(d0.temperature_2m_max[i])+')">'+dot+'</div></div>'
      +'<div class="dhi">'+hi+'°</div></div>';
  }
  $('dlist').innerHTML=dh;

  /* AQI */
  if(lastAQ&&lastAQ.current){
    const v=cnAqi(lastAQ.current.pm2_5,lastAQ.current.pm10);
    const [lv,col]=aqiLevel(v);
    $('aqi').style.display='block';
    $('aqiVal').textContent=v; $('aqiVal').style.color=col;
    $('aqiLvl').textContent=lv; $('aqiLvl').style.color=col;
    $('aqiDot').style.left=Math.min(100,v/300*100)+'%';
    $('aqiTxt').textContent='当前 AQI (CN) 为 '+v+'（PM2.5 '+lastAQ.current.pm2_5+' / PM10 '+lastAQ.current.pm10+' μg/m³）';
  }
}

/* ================= 状态提示 ================= */
function setStatus(ok){
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  if(ok){ $('dot').style.background='#4cd964'; $('statusTxt').textContent='更新于 '+p(n.getHours())+':'+p(n.getMinutes()); }
  else{
    $('dot').style.background= lastFC? '#ffcc00':'#ff5e3a';
    $('statusTxt').textContent= lastFC? '更新失败，显示缓存数据':'数据获取失败，重试中…';
  }
}

/* ================= 拉取 ================= */
async function pull(){
  let ok=true;
  try{ const r=await fetch(FC_URL,{cache:'no-store'}); if(!r.ok) throw 0; lastFC=await r.json(); }
  catch(e){ ok=false; }
  try{ const r2=await fetch(AQ_URL,{cache:'no-store'}); if(!r2.ok) throw 0; lastAQ=await r2.json(); }
  catch(e){}
  if(ok){ lastOK=Date.now(); render(); }
  setStatus(ok);
  setTimeout(pull, ok?CFG.refreshMs:CFG.retryMs);
}
buildStars(); pull();
setTimeout(()=>location.reload(), CFG.reloadMs);

/* ================= 防熄屏 ================= */
let _wl=null;
async function keepAwake(){ try{ _wl=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });
keepAwake();
</script>
</body>
</html>
